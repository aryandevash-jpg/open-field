# Local PostgreSQL + PostGIS matching Neon (PostgreSQL 18, PostGIS 3.6).
#
#   docker compose up -d
#   DATABASE_URL="postgresql://openfield:openfield@localhost:5433/openfield" npx prisma migrate deploy
#
# Port 5433 avoids clashing with a PostgreSQL already installed on 5432.
# Credentials are for local development only.

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: openfield
      POSTGRES_PASSWORD: openfield
      POSTGRES_DB: openfield
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<version>.
      - openfield-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfield -d openfield"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  openfield-db:
